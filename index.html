<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Control</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#080b12;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow:hidden;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

.panel{
    background:rgba(8,11,18,.88);
    border:1px solid rgba(255,255,255,.12);
    border-radius:15px;
    padding:12px 16px;
    box-shadow:0 8px 30px #0008;
    backdrop-filter:blur(10px);
}

.stats{
    display:flex;
    gap:22px;
}

.stat small{
    display:block;
    color:#8991a3;
    font-size:11px;
    text-transform:uppercase;
}

.stat strong{
    font-size:20px;
}

#controls{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    background:rgba(8,11,18,.9);
    padding:10px;
    border-radius:18px;
    border:1px solid #ffffff1a;
}

.lightBtn{
    border:0;
    color:white;
    background:#171d29;
    border-radius:13px;
    padding:12px 17px;
    cursor:pointer;
    font-weight:bold;
    transition:.15s;
}

.lightBtn:hover{
    background:#273143;
    transform:translateY(-2px);
}

.lightBtn.active{
    box-shadow:0 0 20px currentColor;
}

#message{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    background:#111827ee;
    padding:12px 20px;
    border-radius:12px;
    opacity:0;
    transition:.25s;
    pointer-events:none;
}

#message.show{
    opacity:1;
}

#pause{
    pointer-events:auto;
    cursor:pointer;
    border:0;
    color:white;
    background:#202938;
    padding:10px 14px;
    border-radius:10px;
}

#startScreen,#gameOver{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(5,7,12,.88);
    z-index:10;
}

.modal{
    width:min(520px,90%);
    background:#101621;
    border:1px solid #ffffff18;
    border-radius:25px;
    padding:35px;
    text-align:center;
    box-shadow:0 30px 100px #000;
}

.logo{
    font-size:45px;
    font-weight:900;
    margin-bottom:8px;
}

.logo span{
    color:#38bdf8;
}

.modal p{
    color:#9ba4b5;
    line-height:1.6;
    margin:15px 0 25px;
}

.startBtn{
    border:0;
    width:100%;
    padding:16px;
    border-radius:14px;
    color:white;
    font-size:17px;
    font-weight:bold;
    background:linear-gradient(90deg,#2563eb,#06b6d4);
    cursor:pointer;
}

.hidden{display:none!important}

#gameOver h2{
    font-size:35px;
    margin-bottom:15px;
}

.finalScore{
    font-size:55px;
    font-weight:900;
    color:#38bdf8;
}

@media(max-width:700px){
    .stats{gap:10px}
    .stat strong{font-size:16px}
    #controls{flex-wrap:wrap;width:95%;justify-content:center}
    .lightBtn{padding:10px 12px;font-size:12px}
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="ui">

    <div class="panel stats">
        <div class="stat">
            <small>Score</small>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <small>Combo</small>
            <strong id="combo">x1</strong>
        </div>

        <div class="stat">
            <small>Verkeer</small>
            <strong id="traffic">0</strong>
        </div>

        <div class="stat">
            <small>Dag</small>
            <strong id="day">☀️</strong>
        </div>
    </div>

    <div class="panel">
        <button id="pause" onclick="togglePause()">⏸ Pauze</button>
    </div>

</div>

<div id="message"></div>

<div id="controls">

    <button class="lightBtn" onclick="changeLight('north')">
        ⬆️ NOORD
    </button>

    <button class="lightBtn" onclick="changeLight('east')">
        ➡️ OOST
    </button>

    <button class="lightBtn" onclick="changeLight('south')">
        ⬇️ ZUID
    </button>

    <button class="lightBtn" onclick="changeLight('west')">
        ⬅️ WEST
    </button>

    <button class="lightBtn" onclick="toggleWeather()">
        🌧️ Regen
    </button>

</div>


<div id="startScreen">

    <div class="modal">

        <div class="logo">
            🚦 <span>Traffic</span> Control
        </div>

        <p>
            Jij bent verkeersregelaar.<br>
            Bedien de verkeerslichten, voorkom botsingen
            en houd het verkeer zo soepel mogelijk.
        </p>

        <p>
            🚑 Ambulances krijgen voorrang.<br>
            🚛 Vrachtwagens zijn langzamer.<br>
            📈 Hoe langer je speelt, hoe drukker het wordt.
        </p>

        <button class="startBtn" onclick="startGame()">
            🚦 START VERKEERSCENTRALE
        </button>

    </div>

</div>


<div id="gameOver" class="hidden">

    <div class="modal">

        <div style="font-size:60px">💥</div>

        <h2>Verkeerschaos!</h2>

        <div class="finalScore" id="finalScore">0</div>

        <p id="gameOverText"></p>

        <button class="startBtn" onclick="startGame()">
            🔄 OPNIEUW
        </button>

    </div>

</div>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W,H;

function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();


/* ===============================
   GAME VARIABLES
================================ */

let running=false;
let paused=false;

let score=0;
let combo=1;
let spawnTimer=0;
let elapsed=0;

let weather=false;
let night=false;

let cars=[];
let particles=[];


/* verkeerslicht:
   0 = rood
   1 = groen
*/

let lights={
    north:0,
    east:1,
    south:0,
    west:1
};


/* ===============================
   AUDIO
================================ */

let audio=null;

function beep(freq=500,duration=.08){

    try{

        if(!audio)
            audio=new AudioContext();

        const osc=audio.createOscillator();
        const gain=audio.createGain();

        osc.connect(gain);
        gain.connect(audio.destination);

        osc.frequency.value=freq;
        osc.type="sine";

        gain.gain.value=.04;

        osc.start();

        setTimeout(()=>{
            osc.stop();
        },duration*1000);

    }catch(e){}
}


/* ===============================
   START
================================ */

function startGame(){

    if(audio && audio.state==="suspended")
        audio.resume();

    score=0;
    combo=1;
    elapsed=0;
    spawnTimer=0;

    cars=[];
    particles=[];

    lights={
        north:0,
        east:1,
        south:0,
        west:1
    };

    running=true;
    paused=false;

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("gameOver")
        .classList.add("hidden");

    document.getElementById("pause")
        .textContent="⏸ Pauze";

    updateUI();
}


/* ===============================
   ROAD
================================ */

function road(){

    ctx.fillStyle=night ? "#101722" : "#20252c";
    ctx.fillRect(0,H*.37,W,H*.26);

    ctx.fillRect(W*.37,0,W*.26,H);

    /* middenstrepen */

    ctx.strokeStyle="#c9c9c955";
    ctx.lineWidth=3;
    ctx.setLineDash([18,20]);

    ctx.beginPath();
    ctx.moveTo(0,H*.5);
    ctx.lineTo(W,H*.5);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(W*.5,0);
    ctx.lineTo(W*.5,H);
    ctx.stroke();

    ctx.setLineDash([]);

    /* zebrapaden */

    ctx.fillStyle="#ffffff44";

    for(let i=-80;i<80;i+=16){

        ctx.fillRect(
            W*.37+i,
            H*.33,
            8,
            H*.035
        );

        ctx.fillRect(
            W*.63+i,
            H*.63,
            8,
            H*.035
        );
    }
}


/* ===============================
   TRAFFIC LIGHTS
================================ */

function drawLights(){

    drawLight(W*.5,H*.30,"north",true);
    drawLight(W*.68,H*.5,"east",false);
    drawLight(W*.5,H*.70,"south",true);
    drawLight(W*.30,H*.5,"west",false);
}

function drawLight(x,y,direction,vertical){

    ctx.save();

    ctx.translate(x,y);

    if(!vertical)
        ctx.rotate(Math.PI/2);

    ctx.fillStyle="#111";
    ctx.roundRect(-16,-50,32,100,8);
    ctx.fill();

    ctx.fillStyle=
        lights[direction]
        ? "#38d66b"
        : "#ff3b3b";

    ctx.shadowBlur=15;
    ctx.shadowColor=ctx.fillStyle;

    ctx.beginPath();
    ctx.arc(0,lights[direction]?20:-20,9,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.restore();
}


/* ===============================
   VEHICLES
================================ */

function spawnCar(){

    const directions=[
        "north",
        "east",
        "south",
        "west"
    ];

    const dir=
        directions[
            Math.floor(Math.random()*4)
        ];

    let type="car";

    const r=Math.random();

    if(r<.08) type="ambulance";
    else if(r<.18) type="truck";

    const laneOffset=(Math.random()-.5)*45;

    let x,y,vx,vy;

    const speed=
        type==="truck"
        ? 1.1
        : type==="ambulance"
        ? 2.8
        : 1.8+Math.random()*1.1;

    if(dir==="north"){
        x=W*.5+laneOffset;
        y=-70;
        vx=0;
        vy=speed;
    }

    if(dir==="south"){
        x=W*.5+laneOffset;
        y=H+70;
        vx=0;
        vy=-speed;
    }

    if(dir==="east"){
        x=-70;
        y=H*.5+laneOffset;
        vx=speed;
        vy=0;
    }

    if(dir==="west"){
        x=W+70;
        y=H*.5+laneOffset;
        vx=-speed;
        vy=0;
    }

    cars.push({
        x,y,vx,vy,
        speed,
        baseSpeed:speed,
        dir,
        type,
        stopped:false,
        crossed:false,
        angle:Math.atan2(vy,vx)
    });
}


/* ===============================
   UPDATE CARS
================================ */

function updateCars(){

    for(let i=cars.length-1;i>=0;i--){

        const c=cars[i];

        let allowed=lights[c.dir]===1;

        /* ambulances kunnen door */
        if(c.type==="ambulance")
            allowed=true;

        const centerX=W*.5;
        const centerY=H*.5;

        let nearCenter=false;

        if(c.dir==="north")
            nearCenter=
                c.y>centerY-160 &&
                c.y<centerY-20;

        if(c.dir==="south")
            nearCenter=
                c.y<centerY+160 &&
                c.y>centerY+20;

        if(c.dir==="east")
            nearCenter=
                c.x<centerX+160 &&
                c.x>centerX+20;

        if(c.dir==="west")
            nearCenter=
                c.x>centerX-160 &&
                c.x<centerX-20;

        if(nearCenter && !allowed){

            c.vx*=.94;
            c.vy*=.94;

            c.stopped=true;

        }else{

            c.vx +=
                (Math.cos(c.angle)*c.baseSpeed-c.vx)*.08;

            c.vy +=
                (Math.sin(c.angle)*c.baseSpeed-c.vy)*.08;

            c.stopped=false;
        }

        c.x+=c.vx;
        c.y+=c.vy;

        /* punten als voertuig kruispunt verlaat */

        const outside=
            c.x<-100 ||
            c.x>W+100 ||
            c.y<-100 ||
            c.y>H+100;

        if(outside){

            if(c.crossed){
                score+=20*combo;
                combo=Math.min(combo+0.05,8);
            }

            cars.splice(i,1);
        }

        if(
            !c.crossed &&
            Math.abs(c.x-centerX)<50 &&
            Math.abs(c.y-centerY)<50
        ){
            c.crossed=true;
        }
    }
}


/* ===============================
   COLLISION
================================ */

function collisionCheck(){

    for(let i=0;i<cars.length;i++){

        for(let j=i+1;j<cars.length;j++){

            const a=cars[i];
            const b=cars[j];

            const dx=a.x-b.x;
            const dy=a.y-b.y;

            const dist=Math.sqrt(dx*dx+dy*dy);

            if(dist<30){

                /* alleen echte bewegende conflicten */

                if(
                    Math.abs(a.vx-b.vx)>1 ||
                    Math.abs(a.vy-b.vy)>1
                ){

                    crash(a.x,a.y);

                    return true;
                }
            }
        }
    }

    return false;
}


/* ===============================
   CRASH
================================ */

function crash(x,y){

    beep(90,.4);

    for(let i=0;i<30;i++){

        particles.push({
            x,
            y,
            vx:(Math.random()-.5)*6,
            vy:(Math.random()-.5)*6,
            life:1
        });
    }

    running=false;

    document.getElementById("finalScore")
        .textContent=Math.floor(score);

    document.getElementById("gameOverText")
        .textContent=
        `Je eindigde met een combo van x${combo.toFixed(1)}.`;

    document.getElementById("gameOver")
        .classList.remove("hidden");
}


/* ===============================
   DRAW CARS
================================ */

function drawCars(){

    cars.forEach(c=>{

        ctx.save();

        ctx.translate(c.x,c.y);
        ctx.rotate(c.angle);

        let color="#3b82f6";

        if(c.type==="truck")
            color="#f59e0b";

        if(c.type==="ambulance")
            color="#f1f5f9";

        ctx.fillStyle=color;

        const width=
            c.type==="truck" ? 45 : 32;

        const height=
            c.type==="truck" ? 22 : 16;

        ctx.fillRect(
            -width/2,
            -height/2,
            width,
            height
        );

        /* ramen */

        ctx.fillStyle="#111827";

        ctx.fillRect(
            -width*.2,
            -height*.35,
            width*.35,
            height*.7
        );

        /* ambulance */

        if(c.type==="ambulance"){

            ctx.fillStyle="#ef4444";

            ctx.fillRect(
                -5,-2,
                10,4
            );

            ctx.fillRect(
                -2,-7,
                4,14
            );
        }

        ctx.restore();
    });
}


/* ===============================
   PARTICLES
================================ */

function updateParticles(){

    particles.forEach(p=>{

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.08;

        p.life-=.025;
    });

    particles=
        particles.filter(p=>p.life>0);
}

function drawParticles(){

    particles.forEach(p=>{

        ctx.globalAlpha=p.life;

        ctx.fillStyle="#ffb703";

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );
    });

    ctx.globalAlpha=1;
}


/* ===============================
   RAIN
================================ */

function drawRain(){

    if(!weather)return;

    ctx.strokeStyle="#7dd3fc55";
    ctx.lineWidth=1;

    for(let i=0;i<100;i++){

        const x=Math.random()*W;
        const y=Math.random()*H;

        ctx.beginPath();

        ctx.moveTo(x,y);
        ctx.lineTo(x-4,y+15);

        ctx.stroke();
    }
}


/* ===============================
   CHANGE LIGHT
================================ */

function changeLight(direction){

    if(!running)return;

    beep(500,.08);

    /* maak de richting groen,
       tegenoverliggende richting blijft rood */

    lights.north=0;
    lights.east=0;
    lights.south=0;
    lights.west=0;

    lights[direction]=1;

    showMessage(
        `🚦 ${direction.toUpperCase()} heeft groen`
    );
}


/* ===============================
   WEATHER
================================ */

function toggleWeather(){

    weather=!weather;

    showMessage(
        weather
        ? "🌧️ Regen ingeschakeld"
        : "☀️ Regen uitgeschakeld"
    );
}


/* ===============================
   PAUSE
================================ */

function togglePause(){

    if(!running)return;

    paused=!paused;

    document.getElementById("pause")
        .textContent=
        paused
        ? "▶️ Verder"
        : "⏸ Pauze";
}


/* ===============================
   MESSAGE
================================ */

let messageTimer;

function showMessage(text){

    const el=document.getElementById("message");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer=setTimeout(()=>{
        el.classList.remove("show");
    },1200);
}


/* ===============================
   UI
================================ */

function updateUI(){

    document.getElementById("score")
        .textContent=Math.floor(score);

    document.getElementById("combo")
        .textContent="x"+combo.toFixed(1);

    document.getElementById("traffic")
        .textContent=cars.length;

    document.getElementById("day")
        .textContent=night?"🌙":"☀️";
}


/* ===============================
   GAME LOOP
================================ */

let last=performance.now();

function loop(now){

    const dt=Math.min(
        (now-last)/16.67,
        2
    );

    last=now;

    ctx.clearRect(0,0,W,H);

    /* achtergrond */

    ctx.fillStyle=
        night
        ? "#0b1320"
        : "#1b2633";

    ctx.fillRect(0,0,W,H);

    road();

    if(running && !paused){

        elapsed+=dt;

        spawnTimer+=dt;

        /* steeds drukker */

        const spawnRate=
            Math.max(
                38,
                100-elapsed*.015
            );

        if(spawnTimer>spawnRate){

            spawnTimer=0;

            spawnCar();

            /* soms extra auto */

            if(Math.random()<.15)
                spawnCar();
        }

        updateCars();

        if(collisionCheck())
            return;

        updateParticles();

        /* dag/nacht */

        if(Math.floor(elapsed/900)%2===1)
            night=true;
        else
            night=false;
    }

    drawCars();
    drawLights();
    drawParticles();
    drawRain();

    updateUI();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>

</body>
</html>
