<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuizMaster</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #3b2b78, transparent 35%),
        radial-gradient(circle at bottom right, #163b67, transparent 35%),
        #090b16;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: rgba(124,92,255,.12);
    border-radius: 50%;
    filter: blur(100px);
    animation: float 8s ease-in-out infinite;
    pointer-events: none;
}

@keyframes float {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(80px,50px); }
}

.app {
    width: 100%;
    max-width: 900px;
    position: relative;
    z-index: 2;
}

.card {
    background: rgba(17,19,35,.82);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 28px;
    padding: 35px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(18px);
    animation: appear .5s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.logo {
    text-align: center;
    font-size: 50px;
    font-weight: 900;
    background: linear-gradient(90deg,#8c6cff,#4dd9ff);
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #9da1b8;
    margin-bottom: 30px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 15px;
}

.category {
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 25px;
    background: rgba(255,255,255,.05);
    color: white;
    cursor: pointer;
    transition: .25s;
    text-align: left;
}

.category:hover {
    transform: translateY(-6px) scale(1.02);
    background: rgba(255,255,255,.1);
    border-color: rgba(140,108,255,.5);
    box-shadow: 0 15px 35px rgba(0,0,0,.25);
}

.category-icon {
    font-size: 40px;
    margin-bottom: 12px;
}

.category-title {
    font-size: 19px;
    font-weight: bold;
}

.category-count {
    color: #85899f;
    font-size: 13px;
    margin-top: 5px;
}

.menu-buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

.menu-button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 14px;
    color: white;
    background: rgba(255,255,255,.07);
    cursor: pointer;
    transition: .2s;
}

.menu-button:hover {
    background: rgba(255,255,255,.13);
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.question-number {
    color: #aeb2c7;
}

.timer {
    min-width: 65px;
    text-align: center;
    padding: 10px 14px;
    border-radius: 13px;
    background: rgba(255,255,255,.07);
    font-weight: bold;
    transition: .2s;
}

.timer.warning {
    color: #ffc857;
    animation: pulse .8s infinite;
}

.timer.danger {
    color: #ff6262;
    animation: pulse .45s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.08);
    }
}

.progress {
    height: 9px;
    border-radius: 20px;
    background: rgba(255,255,255,.07);
    overflow: hidden;
    margin-bottom: 30px;
}

.progress-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg,#7c5cff,#43d9ff);
    border-radius: 20px;
    transition: width .4s ease;
}

.question {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 25px;
    animation: questionIn .35s ease;
}

@keyframes questionIn {
    from {
        opacity: 0;
        transform: translateX(25px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.answers {
    display: grid;
    gap: 13px;
}

.answer {
    position: relative;
    border: 2px solid rgba(255,255,255,.07);
    border-radius: 16px;
    padding: 18px;
    background: rgba(255,255,255,.045);
    color: white;
    text-align: left;
    font-size: 17px;
    cursor: pointer;
    transition: .2s;
    overflow: hidden;
}

.answer::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
    transform: translateX(-100%);
    transition: .4s;
}

.answer:hover:not(:disabled)::before {
    transform: translateX(100%);
}

.answer:hover:not(:disabled) {
    transform: translateX(6px);
    border-color: rgba(124,92,255,.6);
    background: rgba(124,92,255,.12);
}

.answer.correct {
    border-color: #32d583;
    background: rgba(50,213,131,.15);
    animation: correct .45s ease;
}

.answer.wrong {
    border-color: #ff5555;
    background: rgba(255,85,85,.15);
    animation: shake .4s ease;
}

@keyframes correct {
    50% {
        transform: scale(1.03);
    }
}

@keyframes shake {
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-5px); }
}

.answer:disabled {
    cursor: default;
}

.scorebar {
    display: flex;
    justify-content: space-between;
    margin-top: 22px;
    color: #999db3;
}

.scorebar strong {
    color: white;
}

.hidden {
    display: none !important;
}

.result {
    text-align: center;
}

.result-icon {
    font-size: 70px;
    animation: trophy 1s ease infinite alternate;
}

@keyframes trophy {
    to {
        transform: translateY(-8px) rotate(3deg);
    }
}

.result h2 {
    font-size: 38px;
    margin: 10px 0;
}

.final-score {
    font-size: 65px;
    font-weight: 900;
    background: linear-gradient(90deg,#8c6cff,#4dd9ff);
    -webkit-background-clip: text;
    color: transparent;
    margin: 15px 0;
}

.result-message {
    color: #a8acc0;
    margin-bottom: 25px;
}

.name-input {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.06);
    color: white;
    outline: none;
    font-size: 16px;
    margin-bottom: 12px;
}

.name-input:focus {
    border-color: #7c5cff;
}

.primary-button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg,#7355ff,#39cfff);
    color: white;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
    transition: .2s;
}

.primary-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(92,92,255,.3);
}

.leaderboard {
    margin-top: 25px;
    text-align: left;
}

.leaderboard h3 {
    margin-bottom: 12px;
}

.leader {
    display: flex;
    justify-content: space-between;
    padding: 13px;
    margin: 6px 0;
    border-radius: 12px;
    background: rgba(255,255,255,.05);
}

.rank {
    width: 35px;
    font-weight: bold;
}

.leader-name {
    flex: 1;
}

.leader-score {
    font-weight: bold;
}

.back {
    margin-top: 15px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 13px;
    background: rgba(255,255,255,.07);
    color: white;
    cursor: pointer;
}

.confetti {
    position: fixed;
    width: 9px;
    height: 14px;
    top: -20px;
    z-index: 100;
    animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

@media(max-width:650px) {

    body {
        padding: 12px;
    }

    .card {
        padding: 22px;
        border-radius: 22px;
    }

    .logo {
        font-size: 38px;
    }

    .categories {
        grid-template-columns: 1fr;
    }

    .question {
        font-size: 23px;
    }

    .menu-buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- MENU -->
<div class="card" id="menu">

    <div class="logo">QuizMaster</div>

    <p class="subtitle">
        Test je kennis. Haal punten. Word nummer 1.
    </p>

    <div class="categories">

        <button class="category" onclick="startQuiz('algemeen')">
            <div class="category-icon">🧠</div>
            <div class="category-title">Algemene kennis</div>
            <div class="category-count">10 vragen</div>
        </button>

        <button class="category" onclick="startQuiz('gaming')">
            <div class="category-icon">🎮</div>
            <div class="category-title">Gaming</div>
            <div class="category-count">10 vragen</div>
        </button>

        <button class="category" onclick="startQuiz('sport')">
            <div class="category-icon">🏆</div>
            <div class="category-title">Sport</div>
            <div class="category-count">10 vragen</div>
        </button>

        <button class="category" onclick="startQuiz('technologie')">
            <div class="category-icon">💻</div>
            <div class="category-title">Technologie</div>
            <div class="category-count">10 vragen</div>
        </button>

    </div>

    <div class="menu-buttons">
        <button class="menu-button" onclick="showLeaderboard()">
            🏆 Scorebord
        </button>

        <button class="menu-button" onclick="toggleSound()">
            🔊 Geluid: <span id="soundStatus">Aan</span>
        </button>
    </div>

</div>


<!-- QUIZ -->
<div class="card hidden" id="quiz">

    <div class="topbar">

        <div class="question-number" id="questionNumber">
            Vraag 1 / 10
        </div>

        <div class="timer" id="timer">
            15
        </div>

    </div>

    <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question" id="question"></div>

    <div class="answers" id="answers"></div>

    <div class="scorebar">
        <div>
            Score: <strong id="score">0</strong>
        </div>

        <div>
            Categorie: <strong id="categoryName">-</strong>
        </div>
    </div>

</div>


<!-- RESULTAAT -->
<div class="card hidden result" id="result">

    <div class="result-icon">🏆</div>

    <h2>Quiz voltooid!</h2>

    <div class="final-score" id="finalScore">
        0
    </div>

    <div class="result-message" id="resultMessage"></div>

    <input
        class="name-input"
        id="playerName"
        maxlength="15"
        placeholder="Vul je naam in voor het scorebord..."
    >

    <button class="primary-button" onclick="saveScore()">
        🏆 Score opslaan
    </button>

    <div class="leaderboard" id="resultLeaderboard"></div>

    <button class="back" onclick="goHome()">
        ← Terug naar menu
    </button>

</div>


<!-- SCOREBORD -->
<div class="card hidden" id="leaderboardScreen">

    <div class="result-icon">🏆</div>

    <h2 style="text-align:center;">Top 10</h2>

    <div class="leaderboard" id="leaderboardList"></div>

    <button class="back" onclick="goHome()">
        ← Terug naar menu
    </button>

</div>

</div>


<script>

/* =========================
   VRAGEN
========================= */

const questionSets = {

},

};


/* =========================
   VARIABELEN
========================= */

let questions = [];
let current = 0;
let score = 0;
let timeLeft = 15;
let timer = null;
let soundEnabled = true;
let currentCategory = "";

let leaderboard =
    JSON.parse(localStorage.getItem("quizLeaderboard")) || [];


/* =========================
   GELUID
========================= */

let audioContext = null;

function sound(type) {

    if (!soundEnabled) return;

    if (!audioContext) {
        audioContext =
            new (window.AudioContext || window.webkitAudioContext)();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    let frequency = 500;

    if (type === "correct") frequency = 750;
    if (type === "wrong") frequency = 180;
    if (type === "click") frequency = 450;
    if (type === "finish") frequency = 900;

    oscillator.frequency.value = frequency;
    oscillator.type = "sine";

    gain.gain.setValueAtTime(.08,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .25
    );

    oscillator.start();
    oscillator.stop(audioContext.currentTime + .25);
}

function toggleSound() {

    soundEnabled = !soundEnabled;

    document.getElementById("soundStatus").textContent =
        soundEnabled ? "Aan" : "Uit";

    sound("click");
}


/* =========================
   QUIZ STARTEN
========================= */

function startQuiz(category) {

    sound("click");

    currentCategory = category;

    questions = [...questionSets[category]];

    questions.sort(() => Math.random() - .5);

    current = 0;
    score = 0;

    document.getElementById("menu")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("leaderboardScreen")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.remove("hidden");

    document.getElementById("categoryName")
        .textContent =
        category.charAt(0).toUpperCase() + category.slice(1);

    showQuestion();
}


/* =========================
   VRAAG TONEN
========================= */

function showQuestion() {

    clearInterval(timer);

    const q = questions[current];

    document.getElementById("questionNumber")
        .textContent =
        `Vraag ${current + 1} / ${questions.length}`;

    document.getElementById("progressFill")
        .style.width =
        `${(current / questions.length) * 100}%`;

    const questionElement =
        document.getElementById("question");

    questionElement.style.animation = "none";
    void questionElement.offsetWidth;
    questionElement.style.animation =
        "questionIn .35s ease";

    questionElement.textContent = q.q;

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";

    q.a.forEach((answer,index) => {

        const button =
            document.createElement("button");

        button.className = "answer";
        button.textContent = answer;

        button.onclick = () =>
            selectAnswer(index,button);

        answers.appendChild(button);
    });

    startTimer();
}


/* =========================
   TIMER
========================= */

function startTimer() {

    timeLeft = 15;

    const timerElement =
        document.getElementById("timer");

    timerElement.textContent =
        timeLeft;

    timerElement.className = "timer";

    timer = setInterval(() => {

        timeLeft--;

        timerElement.textContent =
            timeLeft;

        if (timeLeft <= 10) {
            timerElement.className =
                "timer warning";
        }

        if (timeLeft <= 5) {
            timerElement.className =
                "timer danger";
        }

        if (timeLeft <= 0) {

            clearInterval(timer);

            timeOut();
        }

    },1000);
}


/* =========================
   ANTWOORD
========================= */

function selectAnswer(index,button) {

    clearInterval(timer);

    const q = questions[current];

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(b => b.disabled = true);

    if (index === q.c) {

        button.classList.add("correct");

        const points =
            100 + (timeLeft * 10);

        score += points;

        sound("correct");

    } else {

        button.classList.add("wrong");

        buttons[q.c]
            .classList.add("correct");

        sound("wrong");
    }

    document.getElementById("score")
        .textContent = score;

    setTimeout(nextQuestion,900);
}


/* =========================
   TIJD OP
========================= */

function timeOut() {

    const q = questions[current];

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(b => b.disabled = true);

    buttons[q.c]
        .classList.add("correct");

    sound("wrong");

    setTimeout(nextQuestion,900);
}


/* =========================
   VOLGENDE
========================= */

function nextQuestion() {

    current++;

    if (current >= questions.length) {

        finishQuiz();

    } else {

        showQuestion();
    }
}


/* =========================
   QUIZ KLAAR
========================= */

function finishQuiz() {

    clearInterval(timer);

    sound("finish");

    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.remove("hidden");

    document.getElementById("finalScore")
        .textContent = score;

    let message = "";

    if (score >= 1800) {
        message = "🔥 LEGENDARISCH! Jij bent echt goed.";
    }
    else if (score >= 1400) {
        message = "🏆 Geweldige score!";
    }
    else if (score >= 1000) {
        message = "😎 Heel netjes!";
    }
    else if (score >= 600) {
        message = "👍 Goed bezig!";
    }
    else {
        message = "💪 Nog een keer proberen!";
    }

    document.getElementById("resultMessage")
        .textContent = message;

    createConfetti();

    renderLeaderboard(
        document.getElementById("resultLeaderboard")
    );
}


/* =========================
   SCORE OPSLAAN
========================= */

function saveScore() {

    const input =
        document.getElementById("playerName");

    let name =
        input.value.trim();

    if (!name) {
        name = "Speler";
    }

    leaderboard.push({
        name: name.substring(0,15),
        score: score
    });

    leaderboard.sort((a,b) =>
        b.score - a.score
    );

    leaderboard =
        leaderboard.slice(0,10);

    localStorage.setItem(
        "quizLeaderboard",
        JSON.stringify(leaderboard)
    );

    input.value = "";

    sound("finish");

    renderLeaderboard(
        document.getElementById("resultLeaderboard")
    );
}


/* =========================
   SCOREBORD
========================= */

function showLeaderboard() {

    sound("click");

    document.getElementById("menu")
        .classList.add("hidden");

    document.getElementById("leaderboardScreen")
        .classList.remove("hidden");

    renderLeaderboard(
        document.getElementById("leaderboardList")
    );
}

function renderLeaderboard(container) {

    if (!leaderboard.length) {

        container.innerHTML =
            "<p style='color:#999db3;text-align:center;'>Nog geen scores. Word de eerste!</p>";

        return;
    }

    container.innerHTML =
        "<h3>Top 10 spelers</h3>";

    leaderboard.forEach((player,index) => {

        const row =
            document.createElement("div");

        row.className = "leader";

        let medal = "";

        if (index === 0) medal = "🥇";
        else if (index === 1) medal = "🥈";
        else if (index === 2) medal = "🥉";
        else medal = `${index + 1}.`;

        row.innerHTML = `
            <div class="rank">${medal}</div>
            <div class="leader-name">${escapeHTML(player.name)}</div>
            <div class="leader-score">${player.score}</div>
        `;

        container.appendChild(row);
    });
}


/* =========================
   VEILIG TEKST TONEN
========================= */

function escapeHTML(text) {

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   CONFETTI
========================= */

function createConfetti() {

    for (let i = 0; i < 80; i++) {

        const piece =
            document.createElement("div");

        piece.className = "confetti";

        piece.style.left =
            Math.random() * 100 + "vw";

        piece.style.animationDelay =
            Math.random() * 1.5 + "s";

        piece.style.transform =
            `rotate(${Math.random()*360}deg)`;

        document.body.appendChild(piece);

        setTimeout(() => {
            piece.remove();
        },4000);
    }
}


/* =========================
   TERUG NAAR MENU
========================= */

function goHome() {

    clearInterval(timer);

    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("leaderboardScreen")
        .classList.add("hidden");

    document.getElementById("menu")
        .classList.remove("hidden");
}
